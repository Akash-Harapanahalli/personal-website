summary: |
  Graduate Research Assistant in the Formal Methods & Autonomous Control of Transportation Systems ([FACTS](https://coogan.ece.gatech.edu/)) Lab at Georgia Tech, under the supervision of Dr. Samuel Coogan, currently pursuing a PhD in Machine Learning. Research is centered around safety verification of nonlinear AI-based control systems, mainly through reachability, invariance, and contraction analysis. Developer of [immrax](https://github.com/gtfactslab/immrax), a JAX toolbox used to scalably certify safe performance of neural networks in safety-critical control systems and to train neural networks with robust safety guarantees outright.


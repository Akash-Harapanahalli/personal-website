experience:
  - role: Graduate Research Assistant
    org: FACTS Lab, Georgia Tech
    org_url: https://coogan.ece.gatech.edu/group.html
    start: Aug 2022
    end: Present
    summary: "Research is centered around safety verification in AI-based control of nonlinear dynamical systems."
    philosophy: "Develop rich mathematical theory alongside useful computational tools."
    bullets:
      - "AI models have little robustness guarantees; this is dangerous when applied in safety-critical domains."
      - "Developed a mathematical framework and efficient, GPU-scalable, differentiable toolbox called [`immrax`](https://github.com/gtfactslab/immrax) for parametric reachability analysis of nonlinear systems with neural network controllers."
      - "Trained neural network controllers for dynamical systems with formal guarantees of safe operation."
      - "Developed algorithm for efficient reachable set computation in systems evolving on Lie group state spaces."
      - "Studied contracting dynamical systems evolving on homogeneous manifolds with Riemannian metrics."
      - "Mentoring a PhD student and an undergraduate student, building technical communication skills."
    cv: true
    resume: true

  - role: Athena Controls Lead
    org: LIDAR Lab, Georgia Tech
    org_url: https://lab-idar.gatech.edu/
    start: Jan 2020
    end: May 2022
    bullets:
      - "Led and mentored a subteam of 8 undergraduates to design manipulator planning and control solutions for a humanoid robot using position, velocity, and force approaches."
      - "Guided peers through a ramping process to understand complex math and background theory."
      - "Used the DRAKE C++ toolbox to simulate dynamic physical conditions and validate control methods."
      - "Designed impedance controller for robust, compliant task-space position and force robot manipulation."
    cv: true
    resume: true

